<!DOCTYPE html
  assetSelYear: TODAY.getFullYear(),
  assetSelMonth: TODAY.getMonth() + 1,>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>取引収支・資産管理</title>

<!-- PWA マニフェスト（静的ファイルで確実に認識させる） -->
<link rel="manifest" href="./manifest.json">

<!-- テーマカラー -->
<meta name="theme-color" content="#1a1a2e">
<meta name="description" content="株式取引の収支カレンダーと資産管理アプリ">

<!-- iOS Safari PWA設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="取引収支">
<!-- iOS用アイコン（SVG） -->
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='40' fill='%231a1a2e'/%3E%3Cpolyline points='28,125 68,85 108,105 148,54 168,67' fill='none' stroke='%234fc3f7' stroke-width='10' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='28' cy='125' r='7' fill='%234fc3f7'/%3E%3Ccircle cx='68' cy='85' r='7' fill='%234fc3f7'/%3E%3Ccircle cx='108' cy='105' r='7' fill='%234fc3f7'/%3E%3Ccircle cx='148' cy='54' r='7' fill='%234fc3f7'/%3E%3Ccircle cx='168' cy='67' r='7' fill='%234fc3f7'/%3E%3C/svg%3E">

<!-- Android Chrome -->
<meta name="mobile-web-app-capable" content="yes">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  background: #f0f2f5;
  color: #1a1a2e;
  min-height: 100vh;
  overflow-x: hidden;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

header {
  background: #1a1a2e;
  color: white;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 10px;
  position: sticky;
  top: 0;
  z-index: 100;
}
header h1 { font-size: 17px; font-weight: 700; }
.header-actions { margin-left: auto; display: flex; gap: 6px; }
.data-btn { font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 8px; border: none; cursor: pointer; background: rgba(255,255,255,0.15); color: white; }
.data-btn:active { background: rgba(255,255,255,0.28); }

.tab-bar {
  background: #1a1a2e;
  display: flex;
  padding: 0 20px;
  border-top: 1px solid rgba(255,255,255,0.08);
  position: sticky;
  top: 52px;
  z-index: 99;
}
.tab-btn {
  padding: 10px 20px;
  color: rgba(255,255,255,0.5);
  font-size: 13px;
  font-weight: 600;
  background: none;
  border: none;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.tab-btn.active { color: #fff; border-bottom-color: #4fc3f7; }

.main { padding: 16px; max-width: 860px; margin: 0 auto; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

.card {
  background: white;
  border-radius: 12px;
  padding: 18px 20px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  margin-bottom: 14px;
}

/* CALENDAR */
.cal-nav {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;
}
.cal-nav h2 { font-size: 18px; font-weight: 700; }
.cal-nav-btn {
  background: none; border: 1.5px solid #ddd; border-radius: 8px;
  width: 34px; height: 34px; font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.cal-nav-btn:active { background: #e0e0e0; }

.cal-layout {
  display: flex;
  gap: 8px;
  align-items: stretch;
}
.cal-grid {
  flex: 1;
  min-width: 0;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
}
.cal-dow { text-align: center; font-size: 11px; font-weight: 700; color: #aaa; padding: 6px 2px; }
.cal-dow.sun { color: #e74c3c; }
.cal-dow.sat { color: #3b82f6; }

/* 週計 別枠パネル */
.cal-week-panel {
  width: 58px;
  flex-shrink: 0;
  background: #eef2ff;
  border-radius: 10px;
  border: 1.5px solid #c7d2fe;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.cal-week-hdr {
  text-align: center;
  font-size: 10px;
  font-weight: 700;
  color: #6366f1;
  padding: 5px 4px 5px;
  background: #e0e7ff;
  border-bottom: 1.5px solid #c7d2fe;
}
.cal-week-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 72px;
  padding: 4px 2px;
  gap: 3px;
  border-bottom: 1px solid #dde3ff;
}
.cal-week-item:last-child { border-bottom: none; }
.cal-week-lbl { font-size: 8px; color: #a5b4fc; font-weight: 700; letter-spacing: 0.02em; }
.cal-week-val { font-size: 10px; font-weight: 700; text-align: center; line-height: 1.2; color: #a5b4fc; }
.cal-week-val.pos { color: #1e8a4a; }
.cal-week-val.neg { color: #c0392b; }

.cal-cell {
  border-radius: 8px; border: 1.5px solid #eee;
  padding: 5px 4px 4px; min-height: 52px;
  display: flex; flex-direction: column; gap: 2px; background: white;
}
.cal-cell.empty  { background: #fafafa; border-color: transparent; }
.cal-cell.today  { border-color: #1a1a2e !important; }
.cal-cell.has-pos { background: #f0faf4; border-color: #a7f3c0; }
.cal-cell.has-neg { background: #fff4f4; border-color: #fca5a5; }
.cal-cell.sun .cal-day { color: #e74c3c; }
.cal-cell.sat .cal-day { color: #3b82f6; }
.cal-cell.hol .cal-day { color: #e74c3c; }
.cal-day { font-size: 12px; font-weight: 700; color: #555; line-height: 1; }
.cal-holiday { font-size: 8px; color: #e74c3c; line-height: 1.1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.cal-pnl-val {
  font-size: 11px; font-weight: 700; text-align: center; line-height: 1.2;
  flex: 1; display: flex; align-items: center; justify-content: center;
}
.cal-pnl-val.pos { color: #1e8a4a; }
.cal-pnl-val.neg { color: #c0392b; }
.cal-cell:not(.empty) { cursor: pointer; }

/* 入力モーダル */
.pnl-modal {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.45); align-items: center; justify-content: center;
}
.pnl-modal.open { display: flex; }
.pnl-modal-box {
  background: white; border-radius: 18px; padding: 24px 20px 20px;
  width: 300px; max-width: 92vw; box-shadow: 0 8px 32px rgba(0,0,0,0.18);
}
.pnl-modal-title {
  font-size: 13px; font-weight: 700; color: #999; text-align: center; margin-bottom: 14px;
}
.pnl-modal-input {
  width: 100%; border: 2px solid #e0e0e0; border-radius: 10px;
  padding: 12px 10px; font-size: 22px; font-weight: 700;
  text-align: right; outline: none; -webkit-appearance: none;
  color: #1a1a2e; background: #fafafa;
}
.pnl-modal-input:focus { border-color: #1a1a2e; background: white; }
.pnl-modal-btns { display: flex; gap: 8px; margin-top: 14px; }
.pnl-modal-cancel {
  flex: 1; padding: 11px; border: none; border-radius: 10px;
  font-size: 14px; font-weight: 600; cursor: pointer;
  background: #eee; color: #666;
}
.pnl-modal-ok {
  flex: 2; padding: 11px; border: none; border-radius: 10px;
  font-size: 14px; font-weight: 700; cursor: pointer;
  background: #1a1a2e; color: white;
}

.pnl-stats { display: flex; gap: 10px; margin-top: 14px; }
.pnl-stat-box { flex: 1; background: #f7f7f9; border-radius: 10px; padding: 12px 10px; text-align: center; }
.pnl-stat-lbl { font-size: 11px; color: #999; font-weight: 600; margin-bottom: 5px; }
.pnl-stat-val { font-size: 17px; font-weight: 700; color: #1a1a2e; }
.pnl-stat-val.pos { color: #1e8a4a; }
.pnl-stat-val.neg { color: #c0392b; }

/* 月別収支グリッド */
.monthly-grid-inner {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-top: 10px;
}
.monthly-cell {
  background: #f7f7f9;
  border-radius: 8px;
  padding: 10px 6px;
  text-align: center;
  cursor: pointer;
  border: 1.5px solid #eee;
  -webkit-tap-highlight-color: transparent;
}
.monthly-cell:active { opacity: 0.75; }
.monthly-cell.this-month { border-color: #1a1a2e !important; background: #f5f5f9; }
.monthly-cell.has-pos { background: #f0faf4; border-color: #a7f3c0; }
.monthly-cell.has-neg { background: #fff4f4; border-color: #fca5a5; }
.monthly-cell-lbl { font-size: 11px; color: #aaa; font-weight: 600; margin-bottom: 3px; }
.monthly-cell-val { font-size: 12px; font-weight: 700; color: #ccc; }
.monthly-cell-val.pos { color: #1e8a4a; }
.monthly-cell-val.neg { color: #c0392b; }
.monthly-cell-wr { font-size: 10px; color: #999; margin-top: 2px; }

/* ASSET */
.section-title { font-size: 14px; font-weight: 700; color: #1a1a2e; margin-bottom: 14px; }
.asset-total-box {
  background: linear-gradient(135deg, #1a1a2e, #2d4066);
  color: white; border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; text-align: center;
}
.asset-total-lbl { font-size: 11px; opacity: 0.7; margin-bottom: 6px; }
.asset-total-val { font-size: 28px; font-weight: 700; }
.asset-last-update { font-size: 11px; opacity: 0.75; margin-top: 6px; }
.asset-mom-diff { font-size: 13px; font-weight: 700; margin-top: 4px; }
.mom-pos { color: #22c55e; }
.mom-neg { color: #ef4444; }
.stat-pos { color: #22c55e; }
.stat-neg { color: #ef4444; }
.stats-section { margin-top: 16px; padding: 0 2px; }
.stats-card { background: white; border-radius: 14px; padding: 14px 14px 12px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
.stats-card-title { font-size: 13px; font-weight: 700; color: #555; margin-bottom: 12px; }
.dow-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 3px; }
.dow-cell { text-align: center; padding: 4px 1px; }
.dow-name { font-size: 11px; font-weight: 700; margin-bottom: 4px; }
.dow-avg { font-size: 11px; font-weight: 700; margin-bottom: 2px; }
.dow-rate { font-size: 10px; color: #999; white-space: nowrap; overflow: hidden; }
.dow-count { font-size: 10px; color: #bbb; }
.year-quad { display: grid; grid-template-columns: 1fr 1fr; background: #f7f7f9; border-radius: 14px; overflow: hidden; gap: 0; }
.year-quad-cell { background: #f7f7f9; padding: 14px 10px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.year-quad-lbl { font-size: 11px; color: #999; font-weight: 600; }
.year-quad-val { font-size: 18px; font-weight: 700; }
.year-quad-sub { font-size: 11px; color: #aaa; }
.year-quad-lbl { font-size: 11px; color: #999; font-weight: 600; margin-bottom: 4px; }
.year-wl-row { font-size: 11px; display: flex; justify-content: center; gap: 8px; }

.cat-list { display: flex; flex-direction: column; gap: 0; margin-bottom: 16px; }
.cat-item { border-radius: 10px; overflow: hidden; margin-bottom: 8px; border: 1.5px solid #eee; }
.cat-row { display: flex; align-items: center; gap: 4px; padding: 8px 4px 8px 8px; background: white; overflow: hidden; }
.cat-name-btn {
  font-size: 13px; font-weight: 600; color: #1a1a2e;
  flex: 1 1 auto; min-width: 0;
  padding: 2px 0; text-align: left;
  cursor: pointer; text-decoration: underline dotted;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.cat-name-btn:active { opacity: 0.6; }
.cat-input {
  flex: 0 0 90px; width: 90px; max-width: 90px; min-width: 0; border: 1.5px solid #e0e0e0; border-radius: 8px;
  padding: 7px 4px; font-size: 13px; font-weight: 600;
  text-align: right; outline: none; background: #fafafa; -webkit-appearance: none; box-sizing: border-box;
}
.cat-input:focus { border-color: #1a1a2e; background: white; }
.cat-del-btn {
  background: #fff0f0; border: 1.5px solid #fca5a5; border-radius: 8px;
  color: #e74c3c; font-size: 16px; font-weight: 700;
  cursor: pointer; min-width: 36px; min-height: 36px;
  padding: 4px 8px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.cat-del-btn:active { background: #fca5a5; }
.cat-item.cat-dragging { opacity: 0.45; transform: scale(0.97); transition: transform 0.1s; }
.cat-item.cat-drag-above { border-top: 3px solid #6366f1; margin-top: -1px; }

/* カテゴリー別インライングラフ */
.cat-inline-chart {
  display: none;
  background: #f8f8ff;
  border-top: 1.5px solid #e8e0ff;
  padding: 10px 10px 12px;
}
.cat-inline-chart.open { display: block; }
.cat-inline-nav {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
}
.cat-inline-nav span { font-size: 13px; font-weight: 700; color: #6366f1; }
.cat-inline-nav-btn {
  background: none; border: 1px solid #c7d2fe; border-radius: 6px;
  width: 26px; height: 26px; font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: #6366f1; -webkit-tap-highlight-color: transparent;
}
.cat-inline-nav-btn:active { background: #e0e7ff; }
.cat-inline-no-data { text-align: center; color: #bbb; font-size: 12px; padding: 20px 0; }

.add-cat-row { display: flex; gap: 8px; margin-bottom: 16px; }
.add-cat-input {
  flex: 1; border: 1.5px dashed #ccc; border-radius: 8px;
  padding: 7px 10px; font-size: 13px; outline: none;
  background: transparent; color: #555; -webkit-appearance: none;
}
.add-cat-input:focus { border-color: #1a1a2e; }
.add-cat-input::placeholder { color: #bbb; }

.btn { border: none; border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.btn:active { opacity: 0.75; }
.btn-record { background: #1e8a4a; color: white; width: 100%; padding: 13px; font-size: 14px; border-radius: 10px; }
.btn-small  { background: #e8e8ee; color: #555; padding: 7px 12px; }

.month-sel-wrap{margin-bottom:10px;}
.month-sel-year{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px;}
.month-sel-year button{background:none;border:none;font-size:18px;cursor:pointer;color:#555;padding:0 4px;}
.month-sel-year span{font-size:14px;font-weight:700;color:#333;}
.month-sel-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:10px;}
.month-btn{border:1.5px solid #ccc;background:#f8f8f8;border-radius:6px;padding:5px 0;font-size:13px;cursor:pointer;text-align:center;}
.month-btn.sel{background:#4fc3f7;color:#fff;border-color:#0288d1;font-weight:700;}
.chart-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.chart-nav span { font-size: 14px; font-weight: 700; }
canvas#assetChart { width: 100%; display: block; }

/* PWAインストールバナー */
#install-banner {
  display: none; background: #1e8a4a; color: white;
  padding: 12px 16px; font-size: 13px; font-weight: 600;
  align-items: center; justify-content: center; gap: 10px;
}
#install-banner button {
  background: white; color: #1e8a4a; border: none; border-radius: 6px;
  padding: 6px 14px; font-size: 13px; font-weight: 700; cursor: pointer;
}
#install-banner .close-btn {
  background: none; color: rgba(255,255,255,0.7); font-size: 20px; border: none; cursor: pointer;
}

/* 支出管理 */
.exp-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:16px;}
.exp-row{display:flex;align-items:center;padding:11px 2px;border-bottom:1px solid #f0f0f0;gap:8px;}
.exp-row-name{flex:1;font-size:14px;font-weight:600;color:#1a1a2e;}
.exp-row-amt{font-size:14px;font-weight:700;min-width:80px;text-align:right;color:#1a1a2e;}
.exp-row-add{width:30px;height:30px;border-radius:50%;background:#1a1a2e;color:white;border:none;font-size:20px;line-height:1;cursor:pointer;flex-shrink:0;}
.exp-row-del{width:26px;height:26px;border-radius:50%;background:#fee2e2;color:#ef4444;border:none;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0;}
.exp-total-row{display:flex;justify-content:space-between;align-items:center;padding:13px 2px 4px;font-weight:700;font-size:15px;border-top:1.5px solid #e8e8e8;margin-top:4px;}
.exp-add-cat-btn{background:none;border:1.5px dashed #bbb;color:#888;padding:8px 24px;border-radius:20px;font-size:13px;cursor:pointer;}
.exp-drag-handle{width:22px;font-size:16px;color:#ccc;cursor:grab;user-select:none;text-align:center;flex-shrink:0;touch-action:none;padding:0 2px;}
.exp-drag-handle:active{cursor:grabbing;color:#888;}
.cat-item.exp-drag-target{border-top:2.5px solid #1a1a2e;}

@media (max-width: 600px) {
  .main { padding: 8px; }
  .card { padding: 12px 8px; }
  .cal-grid { gap: 2px; grid-template-columns: repeat(7, 1fr); }
  .cal-cell { min-height: 42px; padding: 3px 2px; gap: 1px; }
  .cal-day { font-size: 10px; }
  .cal-holiday { font-size: 7px; }
  .cal-pnl-val { font-size: 8px; line-height: 1.1; white-space: nowrap; overflow: hidden; }
  .cal-week-panel { width: 44px; border-radius: 8px; }
  .cal-week-hdr { font-size: 9px; padding: 4px 2px; }
  .cal-week-item { min-height: 56px; padding: 3px 2px; }
  .cal-week-lbl { font-size: 7px; }
  .cal-week-val { font-size: 9px; }
  .cal-input { font-size: 10px; padding: 1px 0; }
  .pnl-stat-val { font-size: 14px; }
  .asset-total-val { font-size: 22px; }
  .cat-name { min-width: 70px; font-size: 12px; }
  .cat-name-btn { min-width: 70px; }
  .cat-row { gap: 6px; padding: 6px 4px 6px 8px; }
  .asset-dp-day { font-size: 11px; padding: 4px 1px; }
}
</style>
</head>
<body>

<!-- 損益入力モーダル -->
<div class="pnl-modal" id="pnl-modal" onclick="pnlModalBgClick(event)">
  <div class="pnl-modal-box">
    <div class="pnl-modal-title" id="pnl-modal-title"></div>
    <input class="pnl-modal-input" id="pnl-modal-input" type="text" inputmode="decimal"
      placeholder="例: 5000 / -3000"
      onkeydown="if(event.key==='Enter')confirmPnlModal()">
    <div class="pnl-modal-btns">
      <button class="pnl-modal-cancel" onclick="closePnlModal()">キャンセル</button>
      <button class="pnl-modal-ok" onclick="confirmPnlModal()">確定</button>
    </div>
  </div>
</div>

<div id="install-banner">
  <span>📱 ホーム画面に追加できます</span>
  <button id="install-btn">インストール</button>
  <button class="close-btn" onclick="document.getElementById('install-banner').style.display='none'">×</button>
</div>

<header>
  <span style="font-size:22px">💹</span>
  <h1>取引収支・資産管理</h1>
  <div class="header-actions">
    <button class="data-btn export-btn" onclick="exportData()">保存</button>
    <button class="data-btn import-btn" onclick="importData()">復元</button>
  </div>
</header>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('cal')">取引収支</button>
  <button class="tab-btn"        onclick="switchTab('asset')">資産管理</button>
  <button class="tab-btn"        onclick="switchTab('expense')">支出管理</button>
</div>

<div class="main">

  <!-- カレンダータブ -->
  <div class="tab-panel active" id="panel-cal">
    <div class="card">
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="changeMonth(-1)">‹</button>
        <h2 id="cal-title"></h2>
        <button class="cal-nav-btn" onclick="changeMonth(+1)">›</button>
      </div>
      <div class="cal-layout">
        <div class="cal-grid" id="cal-grid"></div>
        <div class="cal-week-panel" id="cal-week-panel"></div>
      </div>
      <div class="pnl-stats">
        <div class="pnl-stat-box"><div class="pnl-stat-lbl">今月</div><div class="pnl-stat-val" id="s-monthly">¥0</div></div>
        <div class="pnl-stat-box"><div class="pnl-stat-lbl">今年</div><div class="pnl-stat-val" id="s-yearly">¥0</div></div>
      </div>
      <div id="monthly-grid"></div>
      <div class="stats-section" id="stats-section"></div>
    </div>
  </div>

    <button class="month-btn" id="mbtn-1" onclick="selectAssetMonth(1)">1月</button><button class="month-btn" id="mbtn-2" onclick="selectAssetMonth(2)">2月</button><button class="month-btn" id="mbtn-3" onclick="selectAssetMonth(3)">3月</button><button class="month-btn" id="mbtn-4" onclick="selectAssetMonth(4)">4月</button><button class="month-btn" id="mbtn-5" onclick="selectAssetMonth(5)">5月</button><button class="month-btn" id="mbtn-6" onclick="selectAssetMonth(6)">6月</button><button class="month-btn" id="mbtn-7" onclick="selectAssetMonth(7)">7月</button><button class="month-btn" id="mbtn-8" onclick="selectAssetMonth(8)">8月</button><button class="month-btn" id="mbtn-9" onclick="selectAssetMonth(9)">9月</button><button class="month-btn" id="mbtn-10" onclick="selectAssetMonth(10)">10月</button><button class="month-btn" id="mbtn-11" onclick="selectAssetMonth(11)">11月</button><button class="month-btn" id="mbtn-12" onclick="selectAssetMonth(12)">12月</button>
  </div>
</div>
<button class="btn btn-record" onclick="recordAsset()">この月の総資産を記録</button>

        <button class="cal-nav-btn" onclick="changeExpMonth(1)">›</button>
      </div>
      <div id="exp-cat-list"></div>

<script>
// ============================================================
// STATE
// ============================================================
const TODAY = new Date();
function goToMonth(mo){
  state.calMonth=mo-1;
  renderCalendar();
  document.getElementById('panel-cal').scrollTop=0;
}

function todayKey() {
  return dateKey(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate());
}
let state = {
  activeTab: 'cal',
  monthlyPnl: {},
  dailyPnl: {},
  calYear:   TODAY.getFullYear(),
  calMonth:  TODAY.getMonth(),
  categories:   ['現金・預金'],
  assetInput:   {},
  assetRecords: {},  // { "YYYY-MM-DD": {total, values} }
  lastAssetUpdate: null,
  chartYear:    TODAY.getFullYear(),
  expenseCategories: ['食費','交通費','娯楽費','通信費','その他'],
  expenses: {},
  expSelYear: TODAY.getFullYear(),
  expSelMonth: TODAY.getMonth()+1,
};
function load() {
  try {
    const s = localStorage.getItem('stk_cal_v3');
    if (s) {
      const loaded = JSON.parse(s);
      // 旧フォーマット(array)→新フォーマット(object)マイグレーション
      if (Array.isArray(loaded.assetRecords)) {
        const obj = {};
        loaded.assetRecords.forEach(r => {
          const k = `${r.year}-${String(r.month).padStart(2,'0')}-${String(r.day||1).padStart(2,'0')}`;
          obj[k] = { total: r.total, values: r.values || {} };
        });
        loaded.assetRecords = obj;
      }
      state = { ...state, ...loaded };
    }
  } catch(e) {}
}
function save() {
  try { localStorage.setItem('stk_cal_v3', JSON.stringify(state)); } catch(e) {}
}
function yen(n) { return n==null||isNaN(n) ? '—' : '¥'+Math.round(n).toLocaleString('ja-JP'); }
function pCls(n) { return n>0?'pos':n<0?'neg':''; }
function dateKey(y,m,d) { return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ============================================================
// TAB
// ============================================================
function switchTab(tab) {
  state.activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b,i) =>
    b.classList.toggle('active', (i===0&&tab==='cal')||(i===1&&tab==='asset')||(i===2&&tab==='expense'))
  );
  document.querySelectorAll('.tab-panel').forEach(p =>
    p.classList.toggle('active', p.id==='panel-'+tab)
  );
  if(tab==='asset'){
    state.assetSelYear=TODAY.getFullYear();
    state.assetSelMonth=TODAY.getMonth()+1;
    state.chartYear=TODAY.getFullYear();
    renderCatList();
    renderAssetMonthSel();
    renderChart();
  }
  if(tab==='expense'){
    state.expSelYear=TODAY.getFullYear();
    state.expSelMonth=TODAY.getMonth()+1;
    save();
    renderExpensePanel();
  }
}

// ============================================================
// 祝日
// ============================================================
const _holCache = {};
function getHolidays(year) {
  if (_holCache[year]) return _holCache[year];
  const h = {};
  const add = (mo,da,name) => { if (!da||da<1) return; h[`${year}-${String(mo).padStart(2,'0')}-${String(da).padStart(2,'0')}`]=name; };
  const nthMon = (mo,n) => {
    const d=new Date(year,mo-1,1); let cnt=0;
    for(let i=0;i<31;i++,d.setDate(d.getDate()+1)){if(d.getMonth()!==mo-1)break;if(d.getDay()===1&&++cnt===n)return d.getDate();}
  };
  add(1,1,'元日');add(2,11,'建国記念の日');add(2,23,'天皇誕生日');
  add(4,29,'昭和の日');add(5,3,'憲法記念日');add(5,4,'みどりの日');add(5,5,'こどもの日');
  add(8,11,'山の日');add(11,3,'文化の日');add(11,23,'勤労感謝の日');
  add(1,nthMon(1,2),'成人の日');add(7,nthMon(7,3),'海の日');
  add(9,nthMon(9,3),'敬老の日');add(10,nthMon(10,2),'スポーツの日');
  const yy=year-1980;
  add(3,Math.floor(20.8431+0.242194*yy-Math.floor(yy/4)),'春分の日');
  add(9,Math.floor(23.2488+0.242194*yy-Math.floor(yy/4)),'秋分の日');
  for(const key of [...Object.keys(h)]){
    const d=new Date(key+'T12:00:00');
    if(d.getDay()===0){let sub=new Date(d);sub.setDate(d.getDate()+1);
      while(true){const sk=`${sub.getFullYear()}-${String(sub.getMonth()+1).padStart(2,'0')}-${String(sub.getDate()).padStart(2,'0')}`;
        if(!h[sk]){h[sk]='振替休日';break;}sub.setDate(sub.getDate()+1);}
    }
  }
  _holCache[year]=h; return h;
}

// ============================================================
// カレンダー（取引収支）
// ============================================================
function changeMonth(delta) {
  state.calMonth+=delta;
  if(state.calMonth>11){state.calMonth=0;state.calYear++;}
  if(state.calMonth<0) {state.calMonth=11;state.calYear--;}
  save(); renderCalendar();
}
let _editKey = null;
function editDailyPnl(key, label) {
  _editKey = key;
  document.getElementById('pnl-modal-title').textContent = label;
  const inp = document.getElementById('pnl-modal-input');
  const cur = state.dailyPnl[key];
  inp.value = cur != null ? cur : '';
  document.getElementById('pnl-modal').classList.add('open');
  setTimeout(() => { inp.focus(); inp.select(); }, 80);
}
function closePnlModal() {
  document.getElementById('pnl-modal').classList.remove('open');
  _editKey = null;
  _expCatIdx = -1;
}
function expDragStart(e,idx){
  e.preventDefault();
  _expDragIdx=idx;_expDragActive=false;_expDragOverIdx=idx;
  _expDragStartY=e.touches?e.touches[0].clientY:e.clientY;
  _expDragTimer=setTimeout(function(){
    _expDragActive=true;
    navigator.vibrate&&navigator.vibrate(50);
    var row=document.getElementById('exp-row-'+idx);
    var rect=row.getBoundingClientRect();
    _expDragClone=row.cloneNode(true);
    _expDragClone.removeAttribute('id');
    _expDragClone.style.cssText='position:fixed;left:'+rect.left+'px;top:'+rect.top+'px;width:'+rect.width+'px;z-index:999;opacity:0.9;box-shadow:0 6px 20px rgba(0,0,0,0.18);border-radius:8px;pointer-events:none;background:#fff;';
    _expDragCloneTop=rect.top;
    document.body.appendChild(_expDragClone);
    row.style.opacity='0.3';
  },400);
  document.addEventListener('touchmove',expDragMove,{passive:false});
  document.addEventListener('touchend',expDragEnd,{once:true});
  document.addEventListener('mousemove',expDragMove);
  document.addEventListener('mouseup',expDragEnd,{once:true});
}
function expDragMove(e){
  var clientY=e.touches?e.touches[0].clientY:e.clientY;
  if(!_expDragActive){
    if(Math.abs(clientY-_expDragStartY)>8){clearTimeout(_expDragTimer);expDragCleanup();}
    return;
  }
  e.preventDefault();
  if(_expDragClone)_expDragClone.style.top=(_expDragCloneTop+(clientY-_expDragStartY))+'px';
  var rows=document.querySelectorAll('.cat-item[data-idx]');
  var newOver=_expDragIdx;
  rows.forEach(function(row){
    var rect=row.getBoundingClientRect();
    if(clientY>rect.top+rect.height/2)newOver=parseInt(row.dataset.idx);
  });
  if(newOver!==_expDragOverIdx){
    _expDragOverIdx=newOver;
    rows.forEach(function(r){r.classList.remove('exp-drag-target');});
    var t=document.querySelector('.cat-item[data-idx="'+newOver+'"]');
    if(t&&newOver!==_expDragIdx)t.classList.add('exp-drag-target');
  }
}
function expDragEnd(){
  clearTimeout(_expDragTimer);
  document.removeEventListener('touchmove',expDragMove);
  document.removeEventListener('mousemove',expDragMove);
  if(_expDragActive&&_expDragIdx>=0&&_expDragOverIdx>=0&&_expDragOverIdx!==_expDragIdx){
    var cats=state.expenseCategories.slice();
    var item=cats.splice(_expDragIdx,1)[0];
    cats.splice(_expDragOverIdx,0,item);
    state.expenseCategories=cats;save();
  }
  expDragCleanup();
  renderExpensePanel();
}
function expDragCleanup(){
  _expDragActive=false;
  if(_expDragClone){_expDragClone.remove();_expDragClone=null;}
  document.querySelectorAll('.cat-item[data-idx]').forEach(function(r){r.style.opacity='';r.classList.remove('exp-drag-target');});
  _expDragIdx=-1;_expDragOverIdx=-1;
}
function pnlModalBgClick(e) {
  if (e.target === document.getElementById('pnl-modal')) closePnlModal();
}
function confirmPnlModal() {
  if (_expCatIdx >= 0) {
    const val=parseFloat(document.getElementById('pnl-modal-input').value.replace(/[,，]/g,'').replace(/[−ー]/g,'-'));
    if(!isNaN(val)&&val>0){
      const y=state.expSelYear,m=state.expSelMonth;
      const key=`${y}-${String(m).padStart(2,'0')}`;
      if(!state.expenses)state.expenses={};
      if(!state.expenses[key])state.expenses[key]={};
      const cat=state.expenseCategories[_expCatIdx];
      state.expenses[key][cat]=(state.expenses[key][cat]||0)+val;
      save();
    }
    closePnlModal();
    renderExpensePanel();
    return;
  }
  if (_editKey === null) return;
  setDailyPnl(_editKey, document.getElementById('pnl-modal-input').value);
  closePnlModal();
}
function clearPnlModal() {
  if (_editKey === null) return;
  delete state.dailyPnl[_editKey];
  save(); renderCalendar();
  closePnlModal();
}
function setDailyPnl(key, rawVal) {
  const val = rawVal.replace(/[,，]/g,'').replace(/[−ー]/g,'-').trim();
  const n = parseFloat(val);
  if (val === '' || val === '-') delete state.dailyPnl[key];
  else if (!isNaN(n)) state.dailyPnl[key] = n;
  save(); renderCalendar();
}
function calcMonthlyTotal(y, mo) {
  const prefix = `${y}-${String(mo).padStart(2,'0')}-`;
  let total = null;
  for (const [k, v] of Object.entries(state.dailyPnl)) {
    if (k.startsWith(prefix)) total = (total || 0) + v;
  }
  return total;
}
function renderCalSummary() {
  const today = new Date(), y = state.calYear, m = state.calMonth;
  const monthly = calcMonthlyTotal(y, m+1) || 0;
  let yearly = 0;
  const thisYear = y;
  for (const [k, v] of Object.entries(state.dailyPnl)) {
    if (k.startsWith(`${thisYear}-`)) yearly += v;
  }
  const set = (id, v) => { const el = document.getElementById(id); if (!el) return;
    el.textContent = (v>=0?'+':'')+yen(v); el.className = 'pnl-stat-val '+pCls(v); };
  set('s-monthly', monthly); set('s-yearly', yearly);
  renderMonthlyGrid();
  renderStats();
}
function renderStats(){
  const ct=document.getElementById('stats-section');
  if(!ct)return;
  const y=state.calYear;
  const yStr=y+'-';
  const entries=Object.entries(state.dailyPnl).filter(([k])=>k.startsWith(yStr));
  const DN=['月','火','水','木','金'];
  const dd=Array.from({length:7},()=>({sum:0,cnt:0,win:0}));
  entries.forEach(([k,v])=>{const d=new Date(k);const dw=d.getDay();dd[dw].sum+=v;dd[dw].cnt++;if(v>0)dd[dw].win++;});
  const wins=entries.filter(([,v])=>v>0).length;
  const losses=entries.filter(([,v])=>v<0).length;
  const tot=entries.length;
  const wr=tot>0?Math.round(wins/tot*100):null;
  const avg=tot>0?entries.reduce((s,[,v])=>s+v,0)/tot:null;
  const bestEntry=tot>0?entries.reduce((a,b)=>b[1]>a[1]?b:a):null;
  const worstEntry=tot>0?entries.reduce((a,b)=>b[1]<a[1]?b:a):null;
  const best=bestEntry?bestEntry[1]:null;
  const worst=worstEntry?worstEntry[1]:null;
  const fmtD=(k)=>{const p=k.split('-');return parseInt(p[1])+'月'+parseInt(p[2])+'日';};
  const dowHtml=DN.map((n,i)=>{
    const d=dd[i+1];
    const a=d.cnt>0?d.sum/d.cnt:null;
    const r=d.cnt>0?Math.round(d.win/d.cnt*100):null;
    const ac=a===null?'':a>=0?'stat-pos':'stat-neg';
    return '<div class="dow-cell"><div class="dow-name">'+n+'</div><div class="dow-avg '+ac+'">'+(a===null?'-':(a>=0?'+':'')+yen(Math.round(a)))+'</div><div class="dow-rate">'+(r===null?'-':'勝率'+r+'%')+'</div><div class="dow-count">'+(r===null?'':d.win+'日 / '+d.cnt+'日')+'</div></div>';
  }).join('');
  const wc=wr!==null&&wr>=50?'stat-pos':'stat-neg';
  const ac2=avg!==null&&avg>=0?'stat-pos':'stat-neg';
  ct.innerHTML=
    '<div class="stats-card"><div class="stats-card-title">曜日別平均損益（'+y+'年）</div><div class="dow-grid">'+dowHtml+'</div></div>'
    +'<div class="stats-card"><div class="stats-card-title">今年度の成績（'+y+'年）</div>'
    +'<div class="year-quad">'
    +'<div class="year-quad-cell"><div class="year-quad-lbl">勝率</div><div class="year-quad-val '+wc+'">'+(wr!==null?wr+'%':'-')+'</div><div class="year-quad-sub">'+wins+'日 / '+tot+'日</div></div>'
    +'<div class="year-quad-cell"><div class="year-quad-lbl">平均損益</div><div class="year-quad-val '+ac2+'">'+(avg!==null?(avg>=0?'+':'')+yen(Math.round(avg)):'-')+'</div></div>'
    +'<div class="year-quad-cell"><div class="year-quad-lbl">最大利益</div><div class="year-quad-val stat-pos">'+(best!==null&&best>0?'+'+yen(best):'-')+'</div>'+(best!==null&&best>0?'<div class="year-quad-sub">'+fmtD(bestEntry[0])+'</div>':'')+'</div>'
    +'<div class="year-quad-cell"><div class="year-quad-lbl">最大損失</div><div class="year-quad-val stat-neg">'+(worst!==null&&worst<0?yen(worst):'-')+'</div>'+(worst!==null&&worst<0?'<div class="year-quad-sub">'+fmtD(worstEntry[0])+'</div>':'')+'</div>'
    +'</div></div>';
}
function renderMonthlyGrid() {
  const container = document.getElementById('monthly-grid');
  if (!container) return;
  const y = state.calYear;
  const today = new Date();
  const thisMonthKey = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
  let html = '<div class="monthly-grid-inner">';
  for (let mo = 1; mo <= 12; mo++) {
    const key = `${y}-${String(mo).padStart(2,'0')}`;
    const val = calcMonthlyTotal(y, mo);
    const isThis = key === thisMonthKey;
    let cls = 'monthly-cell';
    if (isThis) cls += ' this-month';
    if (val != null) cls += val > 0 ? ' has-pos' : val < 0 ? ' has-neg' : '';
    const valHtml = val != null
      ? `<div class="monthly-cell-val ${pCls(val)}">${(val>=0?'+':'')+yen(val)}</div>`
      : `<div class="monthly-cell-val">—</div>`;
    const mEnt=Object.entries(state.dailyPnl).filter(([k])=>k.startsWith(key+'-'));
    const mTot=mEnt.length,mWins=mEnt.filter(([,v])=>v>0).length;
    const mWr=mTot>0?Math.round(mWins/mTot*100):null;
    const wrHtml=mWr!==null?`<div class="monthly-cell-wr">勒率${mWr}%</div>`:'';
    html += `<div class="${cls}" onclick="goToMonth(${mo})"><div class="monthly-cell-lbl">${mo}月</div>${valHtml}${wrHtml}</div>`;
  }
  html += '</div>';
  container.innerHTML = html;
}
function renderCalendar() {
  const y=state.calYear,m=state.calMonth,today=new Date();
  const todayKey_=dateKey(today.getFullYear(),today.getMonth(),today.getDate());
  const holidays=getHolidays(y);
  document.getElementById('cal-title').textContent=`${y}\u5e74${m+1}\u6708`;
  const DOW=['日','月','火','水','木','金','土'];
  const firstDow=new Date(y,m,1).getDay(),daysInMonth=new Date(y,m+1,0).getDate();
  const cells=[];
  for(let i=0;i<firstDow;i++)cells.push(null);
  for(let d=1;d<=daysInMonth;d++)cells.push(d);
  while(cells.length%7!==0)cells.push(null);
  const numWeeks=cells.length/7;
  // カレンダーグリッド
  let html=DOW.map((d,i)=>`<div class="cal-dow ${i===0?'sun':i===6?'sat':''}">${d}</div>`).join('');
  for(let i=0;i<cells.length;i++){
    const d=cells[i];
    if(d===null){html+=`<div class="cal-cell empty"></div>`;continue;}
    const key=dateKey(y,m,d),holiday=holidays[key];
    const isToday=key===todayKey_,col=i%7,isSun=col===0,isSat=col===6;
    const pnlVal=state.dailyPnl[key];
    let cls='cal-cell';
    if(isToday)cls+=' today';if(isSun)cls+=' sun';if(isSat)cls+=' sat';
    if(holiday&&!isSun)cls+=' hol';
    if(pnlVal!=null){cls+=pnlVal>0?' has-pos':pnlVal<0?' has-neg':'';}
    const holLabel=holiday?`<div class="cal-holiday">${holiday}</div>`:'';
    const pnlLabel=pnlVal!=null?`<div class="cal-pnl-val ${pCls(pnlVal)}">${shortYen(pnlVal)}</div>`:'';
    html+=`<div class="${cls}" onclick="editDailyPnl('${key}','${y}\u5e74${m+1}\u6708${d}\u65e5')"><div class="cal-day">${d}</div>${holLabel}${pnlLabel}</div>`;
  }
  document.getElementById('cal-grid').innerHTML=html;
  // 週計パネル
  let weekHtml='<div class="cal-week-hdr">週計</div>';
  for(let w=0;w<numWeeks;w++){
    let weekTotal=null;
    for(let c=0;c<7;c++){
      const d=cells[w*7+c];
      if(d===null)continue;
      const v=state.dailyPnl[dateKey(y,m,d)];
      if(v!=null)weekTotal=(weekTotal||0)+v;
    }
    const vHtml=weekTotal!=null
      ?`<div class="cal-week-val ${pCls(weekTotal)}">${shortYen(weekTotal)}</div>`
      :`<div class="cal-week-val">—</div>`;
    weekHtml+=`<div class="cal-week-item">${vHtml}</div>`;
  }
  document.getElementById('cal-week-panel').innerHTML=weekHtml;
  renderCalSummary();
  setTimeout(syncWeekPanel, 50);
}
function syncWeekPanel() {
  const grid=document.getElementById('cal-grid');
  const panel=document.getElementById('cal-week-panel');
  if(!grid||!panel)return;
  const cells=[...grid.children];
  if(cells.length<7)return;
  // 曜日ヘッ㄀ー行の高さに週計ヘッダーを合わせる
  const hdrH=Math.max(...cells.slice(0,7).map(c=>c.getBoundingClientRect().height));
  if(hdrH===0){setTimeout(syncWeekPanel,150);return;}
  const wHdr=panel.querySelector('.cal-week-hdr');
  if(wHdr){wHdr.style.height=hdrH+'px';wHdr.style.boxSizing='border-box';}
  // 各週行の高さに週計アイテムを合わせる
  const wItems=[...panel.querySelectorAll('.cal-week-item')];
  const dataCells=cells.slice(7);
  wItems.forEach((item,i)=>{
    const row=dataCells.slice(i*7,(i+1)*7);
    if(!row.length)return;
    const rowH=Math.max(...row.map(c=>c.getBoundingClientRect().height));
    item.style.cssText=`height:${rowH}px;min-height:0;flex:0 0 ${rowH}px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-bottom:1px solid #dde3ff;`;
  });
}

function calcAssetTotal(){return state.categories.reduce((s,c)=>s+(parseFloat(String(state.assetInput[c]||'0').replace(/,/g,''))||0),0);}
function updateAssetTotal(){const el=document.getElementById('asset-total-disp');if(el)el.textContent=yen(calcAssetTotal());const dl=document.getElementById('asset-last-update');if(dl){const d=state.lastAssetUpdate;dl.innerHTML=d?'更新日<br>'+d:'';}
  const me=document.getElementById('asset-mom-diff');
  if(me){const cy=state.assetSelYear,cm=state.assetSelMonth;const pm=cm===1?12:cm-1,py=cm===1?cy-1:cy;const pk=py+'-'+String(pm).padStart(2,'0');const prevT=state.assetRecords[pk]&&state.assetRecords[pk].total;if(prevT!=null){const diff=calcAssetTotal()-prevT;const sign=diff>=0?'+':'';me.textContent='先月比 '+sign+yen(diff);me.className='asset-mom-diff '+(diff>=0?'mom-pos':'mom-neg');}else{me.textContent='';}}
}
function catChartId(cat) { return 'cc-' + btoa(encodeURIComponent(cat)).replace(/[^a-zA-Z0-9]/g,''); }

function renderCatList(){
  const list=document.getElementById('cat-list');if(!list)return;
  list.innerHTML=state.categories.map((cat,idx)=>{
    const val=state.assetInput[cat]!=null?state.assetInput[cat]:'';
    const canDel=state.categories.length>1;
    const esc=escHtml(cat);
    const cid=catChartId(cat);
    return `<div class="cat-item">
      <div class="cat-row">
        <span class="cat-name-btn" onclick="toggleCatChart('${esc}','${cid}')">${esc} ▾</span>
        <input class="cat-input" type="text" inputmode="numeric" value="${val}" placeholder="0"
          oninput="setAssetInput('${esc}',this.value)" onfocus="this.select()">
        ${canDel?`<button class="cat-del-btn" onclick="deleteCategory(${idx})">×</button>`:''}
      </div>
      <div class="cat-inline-chart" id="${cid}">
        <div class="cat-inline-nav">
          <button class="cat-inline-nav-btn" onclick="catInlineYearChange('${esc}','${cid}',-1)">‹</button>
          <span id="${cid}-lbl"></span>
          <button class="cat-inline-nav-btn" onclick="catInlineYearChange('${esc}','${cid}',+1)">›</button>
        </div>
        <canvas id="${cid}-canvas" height="160" style="width:100%;display:block"></canvas>
        <div id="${cid}-nodata" class="cat-inline-no-data" style="display:none">記録がありません</div>
      </div>
    </div>`;
  }).join('');
  updateAssetTotal();
  initCatDrag();
}
function setAssetInput(cat,rawVal){
  const v=rawVal.replace(/[,，]/g,'').replace(/[−ー]/g,'-').trim(),n=parseFloat(v);
  if(v===''||isNaN(n))delete state.assetInput[cat];else state.assetInput[cat]=n;
  save();updateAssetTotal();
}
function addCategory(){
  const inp=document.getElementById('new-cat-name'),name=inp.value.trim();if(!name)return;
  if(state.categories.includes(name)){alert('同じ名前のカテゴリーが既にあります');return;}
  state.categories.push(name);inp.value='';save();renderCatList();
}
function deleteCategory(idx){
  const cat=state.categories[idx];if(!confirm(`「${cat}」を削除しますか？`))return;
  state.categories.splice(idx,1);delete state.assetInput[cat];save();renderCatList();
}
var _catDrag={idx:null,el:null,timer:null,toIdx:null};
function initCatDrag(){
  var list=document.getElementById('cat-list');
  if(!list||list._dragInited)return;
  list._dragInited=true;
  list.addEventListener('touchstart',function(e){
    var item=e.target.closest('.cat-item');
    if(!item)return;
    var items=[].slice.call(list.querySelectorAll('.cat-item'));
    var idx=items.indexOf(item);
    if(idx<0)return;
    _catDrag.timer=setTimeout(function(){
      _catDrag.idx=idx;_catDrag.el=item;_catDrag.toIdx=idx;
      item.classList.add('cat-dragging');
      navigator.vibrate&&navigator.vibrate(40);
    },400);
  },{passive:true});
  list.addEventListener('touchmove',function(e){
    clearTimeout(_catDrag.timer);_catDrag.timer=null;
    if(_catDrag.idx===null)return;
    e.preventDefault();
    var touch=e.touches[0];
    var allItems=[].slice.call(list.querySelectorAll('.cat-item'));
    var toIdx=allItems.length-1;
    for(var i=0;i<allItems.length;i++){
      if(allItems[i]===_catDrag.el)continue;
      var rect=allItems[i].getBoundingClientRect();
      if(touch.clientY<rect.top+rect.height/2){toIdx=i;break;}
      else toIdx=i+1;
    }
    var adj=toIdx>_catDrag.idx?toIdx-1:toIdx;
    _catDrag.toIdx=adj;
    allItems.forEach(function(el,i){el.classList.toggle('cat-drag-above',i===adj&&i!==_catDrag.idx);});
  },{passive:false});
  function endDrag(){
    clearTimeout(_catDrag.timer);_catDrag.timer=null;
    var allItems=[].slice.call(list.querySelectorAll('.cat-item'));
    allItems.forEach(function(el){el.classList.remove('cat-drag-above','cat-dragging');});
    if(_catDrag.idx===null)return;
    var from=_catDrag.idx,to=_catDrag.toIdx!=null?_catDrag.toIdx:_catDrag.idx;
    _catDrag.idx=null;_catDrag.el=null;_catDrag.toIdx=null;
    if(from!==to){
      var cat=state.categories.splice(from,1)[0];
      state.categories.splice(to,0,cat);
      save();renderCatList();
    }
  }
  list.addEventListener('touchend',endDrag,{passive:true});
  list.addEventListener('touchcancel',endDrag,{passive:true});
}

function recordAsset(){
  const y=state.assetSelYear,m=state.assetSelMonth;
  const key=`${y}-${String(m).padStart(2,'0')}`;
  if(state.assetRecords[key]){
    if(!confirm(y+'\u5e74'+m+'\u6708\u306e\u8a18\u9332\u306f\u3059\u3067\u306b\u5b58\u5728\u3057\u307e\u3059\u3002\u4e0a\u66f8\u304d\u3057\u307e\u3059\u304b\uff1f'))return;
  }
  const total=calcAssetTotal();
  const values={};
  state.categories.forEach(c=>{
    values[c]=parseFloat(String(state.assetInput[c]||'0').replace(/,/g,''))||0;
  });
  Object.keys(state.assetRecords).filter(k=>k.startsWith(key+'-')).forEach(k=>delete state.assetRecords[k]);
  state.assetRecords[key]={total,values};
  const _now=new Date();state.lastAssetUpdate=_now.getFullYear()+'年'+(_now.getMonth()+1)+'月'+_now.getDate()+'日';
  save();renderChart();
  state.categories.forEach(function(cat){var cid=catChartId(cat);var p=document.getElementById(cid);if(p&&p.classList.contains('open'))renderCatInlineChart(cat,cid);});
  alert(`${y}年${m}月の資産 ${yen(total)} を記録しました`);
}

function selectAssetMonth(m){

}
function assetYearChange(delta){

function renderAssetMonthSel(){

// ============================================================
// カテゴリー別インライングラフ
// ============================================================
const _catYears = {}; // cat -> year

function toggleCatChart(cat, cid) {
  const panel = document.getElementById(cid);
  if (!panel) return;
  const isOpen = panel.classList.toggle('open');
  if (isOpen) {
    if (!_catYears[cat]) _catYears[cat] = TODAY.getFullYear();
    renderCatInlineChart(cat, cid);
  }
}

function catInlineYearChange(cat, cid, delta) {
  _catYears[cat] = (_catYears[cat] || TODAY.getFullYear()) + delta;
  renderCatInlineChart(cat, cid);
}

function renderCatInlineChart(cat, cid) {
  const y = _catYears[cat] || TODAY.getFullYear();
  const lbl = document.getElementById(cid + '-lbl');
  const canvas = document.getElementById(cid + '-canvas');
  const noData = document.getElementById(cid + '-nodata');
  if (!canvas) return;
  if (lbl) lbl.textContent = `${y}年`;
  const months = Array.from({length:12},(_,i)=>i+1);
  const vals = months.map(mo => {
    const prefix = `${y}-${String(mo).padStart(2,'0')}`;
    const keys = Object.keys(state.assetRecords).filter(k => k===prefix||k.startsWith(prefix+'-'));
    if (!keys.length) return null;
    keys.sort();
    const rec = state.assetRecords[keys[keys.length-1]];
    return (rec.values && rec.values[cat] != null) ? rec.values[cat] : null;
  });
  if (!vals.some(v => v !== null && v !== 0)) {
    canvas.style.display='none'; noData.style.display='block'; return;
  }
  canvas.style.display='block'; noData.style.display='none';
  const W = canvas.parentElement.clientWidth - 4, H = 160;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d'); ctx.clearRect(0,0,W,H);
  const PAD = {top:22,right:14,bottom:30,left:6};
  const cW = W-PAD.left-PAD.right, cH = H-PAD.top-PAD.bottom;
  const dv = vals.filter(v=>v!==null&&v!==0);
  let maxV=Math.max(...dv), minV=Math.min(...dv);
  if(maxV===minV){maxV+=1000;minV=Math.max(0,minV-1000);}
  else{const p=(maxV-minV)*0.15;maxV+=p;minV=Math.max(0,minV-p);}
  const barW=cW/12*0.62;
  const xCenter=mo=>PAD.left+((mo-0.5)/12)*cW;
  const yOf=v=>PAD.top+(1-(v-minV)/(maxV-minV))*cH;
  const base=PAD.top+cH;
  ctx.fillStyle='#bbb'; ctx.font='9px sans-serif'; ctx.textAlign='center';
  months.forEach(mo=>ctx.fillText(mo+'月',xCenter(mo),H-PAD.bottom+12));
  const col='#6366f1';
  vals.forEach((v,i)=>{
    if(v===null||v===0)return;
    const mo=i+1,x=xCenter(mo),y=yOf(v);
    ctx.fillStyle=col;
    const r=2;
    ctx.beginPath();
    ctx.moveTo(x-barW/2+r,y);ctx.lineTo(x+barW/2-r,y);ctx.arcTo(x+barW/2,y,x+barW/2,y+r,r);
    ctx.lineTo(x+barW/2,base);ctx.lineTo(x-barW/2,base);ctx.lineTo(x-barW/2,y+r);
    ctx.arcTo(x-barW/2,y,x-barW/2+r,y,r);ctx.closePath();ctx.fill();
    ctx.fillStyle='#333';ctx.font='bold 8px sans-serif';ctx.textAlign='center';
    ctx.fillText(yen(v),x,y-4);
  });
}

// ============================================================
// グラフ（月次 - 各月の最終記録を使用）
// ============================================================
function changeChartYear(delta){state.chartYear+=delta;save();renderChart();}
function renderChart(){
  const y=state.chartYear;document.getElementById('chart-year-lbl').textContent=`${y}年`;
  const canvas=document.getElementById('assetChart'),noData=document.getElementById('chart-no-data');
  const months=Array.from({length:12},(_,i)=>i+1);
  const vals = months.map(mo => {
    const prefix = `${y}-${String(mo).padStart(2,'0')}`;
    const keys = Object.keys(state.assetRecords).filter(k => k===prefix||k.startsWith(prefix+'-'));
    if (keys.length === 0) return null;
    keys.sort();
    return state.assetRecords[keys[keys.length-1]].total;
  });
  if(!vals.some(v=>v!==null)){canvas.style.display='none';noData.style.display='block';return;}
  canvas.style.display='block';noData.style.display='none';
  const W=canvas.parentElement.clientWidth-40,H=220;
  canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');ctx.clearRect(0,0,W,H);
  const PAD={top:28,right:8,bottom:36,left:8},cW=W-PAD.left-PAD.right,cH=H-PAD.top-PAD.bottom;
  const dv=vals.filter(v=>v!==null&&v!==0);let maxV=Math.max(...dv),minV=Math.min(...dv);
  if(maxV===minV){maxV+=1000;minV=Math.max(0,minV-1000);}else{const p=(maxV-minV)*0.15;maxV+=p;minV=Math.max(0,minV-p);}
  const barW=cW/12*0.62;
  const xCenter=mo=>PAD.left+((mo-0.5)/12)*cW;
  const yOf=v=>PAD.top+(1-(v-minV)/(maxV-minV))*cH;
  const base=PAD.top+cH;
  ctx.fillStyle='#aaa';ctx.font='10px sans-serif';ctx.textAlign='center';
  months.forEach(mo=>ctx.fillText(mo+'月',xCenter(mo),H-PAD.bottom+14));
  vals.forEach((v,i)=>{
    if(v===null||v===0)return;
    const mo=i+1,x=xCenter(mo),y=yOf(v);
    ctx.fillStyle='#4fc3f7';
    ctx.beginPath();
    const r=3;
    ctx.moveTo(x-barW/2+r,y);ctx.lineTo(x+barW/2-r,y);ctx.arcTo(x+barW/2,y,x+barW/2,y+r,r);
    ctx.lineTo(x+barW/2,base);ctx.lineTo(x-barW/2,base);ctx.lineTo(x-barW/2,y+r);
    ctx.arcTo(x-barW/2,y,x-barW/2+r,y,r);ctx.closePath();ctx.fill();
    ctx.fillStyle='#333';ctx.font='bold 9px sans-serif';ctx.textAlign='center';
    ctx.fillText(yen(v),x,y-5);
  });
}

}

function setExpCatAmt(idx,value){

  const y=state.expSelYear,m=state.expSelMonth;

function delExpCat(i){

function exportData(){
  const data=localStorage.getItem('stk_cal_v3')||'{}';
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const d=new Date();
  a.download='trading-cal-'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.json';
  a.href=url;a.click();URL.revokeObjectURL(url);

function importData(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.json';
  inp.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        JSON.parse(ev.target.result);
        localStorage.setItem('stk_cal_v3',ev.target.result);
        location.reload();
      }catch(err){alert('ファイル形式エラー');}
    };
    r.readAsText(f);
  };
  inp.click();
}
